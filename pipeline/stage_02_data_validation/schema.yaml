    max: 100

  Sex:
    dtype: str
    allowed_values:
      - M
      - F

  ChestPainType:
    dtype: str
    allowed_values:
      - TA
      - ATA
      - NAP
      - ASY

  RestingBP:
    dtype: int
    min: 0
    max: 250

  Cholesterol:
    dtype: int
    min: 0
    max: 700

  FastingBS:
    dtype: int
    allowed_values:
      - 0
      - 1

  RestingECG:
    dtype: str
