      - Normal
      - ST
      - LVH

  MaxHR:
    dtype: int
    min: 60
    max: 220

  ExerciseAngina:
    dtype: str
    allowed_values:
      - Y
      - N

  Oldpeak:
    dtype: float
    min: -3.0
    max: 10.0

  ST_Slope:
    dtype: str
    allowed_values:
