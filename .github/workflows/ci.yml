name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline
        run: python run_pipeline.py

      - name: Show training results
        run: cat pipeline/stage_04_model_training/artifacts/training_results.json

      - name: Show evaluation report
        run: cat pipeline/stage_05_evaluation/artifacts/evaluation_report.json